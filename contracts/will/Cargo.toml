[package]
name = "will"
version = "1.4.0"
edition = "2021"
license = "MIT"
description = "SoroWill: trustless on-chain inheritance and dead man's switch protocol for Stellar Soroban"
repository = "https://github.com/SoroWill/sorowill-contracts"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
# Only pulled in by the `fuzzing` feature, for deriving `Arbitrary` on the
# fuzz harness input types.
arbitrary = { version = "1", features = ["derive"], optional = true }
# Ed25519 signature verification for critical operations (issue #778).
ed25519-dalek = { version = "2", default-features = false, features = ["alloc"] }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = "1.5"

[features]
testutils = ["soroban-sdk/testutils"]
# Exposes `will::fuzz_harness` to out-of-crate fuzzing front-ends (the
# cargo-fuzz targets under `fuzz/`). Enabling it links `std` and the Soroban
# test host, so it must never be enabled for a wasm build. See docs/FUZZING.md.
fuzzing = ["soroban-sdk/testutils", "dep:arbitrary"]

# Gas optimization benchmarks (issue #769).
#
# The benchmark suite lives in `tests/gas_benchmarks.rs` and is gated behind
# this feature so it never runs as part of the default test matrix. It reuses
# the Soroban test host to measure CPU instructions and memory for every will
# contract operation, then asserts the documented budgets in
# `docs/GAS_BENCHMARKS.md`.
#
# Run with:
#   cargo test -p will --features gas-benchmarks --test gas_benchmarks -- --nocapture
#
# The feature implies `testutils` because the benchmarks need the test host.
gas-benchmarks = ["testutils"]
