name: Contract Audit

on:
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - '.github/workflows/audit.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - '.github/workflows/audit.yml'
  workflow_dispatch:

jobs:
  compliance:
    name: Will Contract Compliance Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/will
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/will/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Compliance tests
        run: cargo test --all-targets compliance

      - name: Full test suite
        run: cargo test --all-targets

      - name: Audit documentation present
        run: |
          test -f docs/COMPLIANCE.md || { echo "Missing docs/COMPLIANCE.md"; exit 1; }
          test -f docs/AUDIT.md || { echo "Missing docs/AUDIT.md"; exit 1; }
