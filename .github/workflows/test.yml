name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Check CHANGELOG.md is updated with CONTRACT_VERSION changes
        run: bash .github/scripts/check-changelog.sh
        if: github.event_name == 'pull_request'

      # The contract is `no_std` for wasm and only links `std` under `cfg(test)`
      # or the `fuzzing` feature. Building for the real target keeps that split
      # honest — a `std` dependency leaking into the contract would pass the
      # tests above and only fail at deploy time.
      - name: Build contract for wasm
        run: cargo build --workspace --release --target wasm32v1-none
